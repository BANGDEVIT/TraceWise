# Cấu hình TraceWise. Đổi mô hình hay máy chủ LLM: sửa file này, hoặc tạo file khác
# rồi trỏ biến môi trường M3_CONFIG tới nó. Không sửa code.

llm: # máy chủ tương thích OpenAI (FR-LLM-01)
  base_url: http://localhost:11434/v1 # biến môi trường OLLAMA_HOST (nếu có) sẽ ghi đè
  model: qwen3.5:4b
  api_key_env: M3_LLM_API_KEY # tên biến chứa khóa API (Ollama không cần)
  temperature: 0.0
  seed: 42
  max_tokens: 800 # B6: câu trả lời 290–390 token; để dư để JSON không bị cắt
  timeout_s: 900
  response_format: json_schema # B6: enum được áp qua /v1
  reasoning_effort: none # B6: bắt buộc; thiếu thì Qwen "suy nghĩ" và JSON bị cắt
  json_retries: 1 # B5: JSON hỏng thì gọi lại 1 lần (bị cắt thì gấp đôi max_tokens)

embed:
  base_url: http://localhost:11434/v1
  model: embeddinggemma
  dim: 768 # số chiều vector của embeddinggemma
  query_prefix: "task: search result | query: " # EmbeddingGemma: tiền tố cho câu truy vấn
  doc_template: "title: {title} | text: {text}" # EmbeddingGemma: khuôn cho tài liệu

allowlist_file: data/srs/allowlist_llm.yaml # FR-07
attack_stix: data/attack/enterprise-attack-18.1.json

analysis:
  prompt: analyze_v1 # file prompts/<tên>.md
  summary_prompt: summary_v1
  rag: true
  k: 5
  platform_filter: true
  query_mode: pack # pack | summary

host_platform: # nền tảng ATT&CK của từng máy lab (sau này lấy từ agent.os của Wazuh)
  lab-win02: Windows
  lab-web01: Linux
  lab-db01: Linux

db:
  dsn_env: M3_PG_DSN # chuỗi kết nối (có mật khẩu) nằm trong .env, không ghi ở đây
